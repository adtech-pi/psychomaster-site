    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #FF6B35;
      --navy: #1A1A2E;
      --gold: #FFD700;
      --bg: #0F0F1A;
      --card-bg: #16213E;
      --cream: #FAF6F0;
      --text: #F0EAD6;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .screen {
      display: none;
      width: 100%;
      max-width: 480px;
      text-align: center;
      animation: fadeIn 0.4s ease;
    }
    .screen.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.5;} }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Welcome Screen */
    .welcome-icon { font-size: 80px; margin-bottom: 24px; }
    .welcome-title { font-size: 28px; font-weight: 700; color: var(--primary); margin-bottom: 12px; line-height: 1.3; }
    .welcome-sub { font-size: 15px; color: #999; margin-bottom: 36px; line-height: 1.6; }
    .start-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 16px 48px;
      font-size: 17px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .start-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,107,53,0.4); }

    /* Question Screen */
    .progress-wrap { margin-bottom: 32px; }
    .progress-label { font-size: 13px; color: #666; margin-bottom: 8px; }
    .progress-bar { height: 4px; background: #333; border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--primary); border-radius: 4px; transition: width 0.4s ease; width: 0%; }
    .question-text { font-size: 18px; font-weight: 600; margin-bottom: 28px; line-height: 1.5; color: var(--cream); }
    .options { display: flex; flex-direction: column; gap: 12px; }
    .option-btn {
      background: var(--card-bg);
      color: var(--text);
      border: 2px solid #2a2a4a;
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s, background 0.2s;
      line-height: 1.5;
    }
    .option-btn:hover { border-color: var(--primary); transform: translateX(4px); background: #1e2a4a; }
    .option-btn:active { transform: scale(0.98); }

    /* Processing Screen */
    .processing-icon { font-size: 64px; margin-bottom: 24px; animation: pulse 1s ease infinite; }
    .processing-text { font-size: 18px; color: #888; }

    /* Result Screen */
    .result-animal { font-size: 80px; margin-bottom: 16px; }
    .result-type { font-size: 26px; font-weight: 700; color: var(--primary); margin-bottom: 8px; }
    .result-desc { font-size: 15px; color: #aaa; margin-bottom: 24px; line-height: 1.6; max-width: 360px; margin-left: auto; margin-right: auto; }
    .result-tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 28px; }
    .tag {
      background: rgba(255,107,53,0.15);
      color: var(--primary);
      border: 1px solid rgba(255,107,53,0.3);
      padding: 4px 12px;
      border-radius: 50px;
      font-size: 12px;
    }
    .share-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 14px 40px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      margin: 8px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .share-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,107,53,0.3); }
    .share-btn.secondary { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
    .retake-btn { display: block; margin: 16px auto 0; background: none; border: none; color: #666; font-size: 13px; cursor: pointer; }
    .retake-btn:hover { color: var(--text); }
    .disclaimer { font-size: 11px; color: #444; margin-top: 24px; }
  </style>
</head>
<body>

<!-- Welcome Screen -->
<div id="screen-welcome" class="screen active">
  <div class="welcome-icon">🐾</div>
  <div class="welcome-title">我是哪种职场濒危生物</div>

</div>

<!-- Question Screen -->
<div id="screen-question" class="screen">

    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  </div>
  <div class="question-text" id="q-text"></div>
  <div class="options" id="options"></div>
</div>

<!-- Processing Screen -->
<div id="screen-processing" class="screen">
  <div class="processing-icon">🔮</div>
  <div class="processing-text">正在分析你的职场属性…</div>
</div>

<!-- Result Screen -->
<div id="screen-result" class="screen">
  <div class="result-animal" id="r-emoji"></div>
  <div class="result-type" id="r-name"></div>
  <div class="result-desc" id="r-desc"></div>
  <div class="result-tags" id="r-tags"></div>
  <button class="share-btn" onclick="shareResult()">分享我的职场濒危生物</button>
  <button class="share-btn secondary" onclick="copyResult()">复制结果</button>
  <button class="retake-btn" onclick="retake()">重新测试</button>
  <div class="disclaimer">仅供娱乐参考，非职业心理评估</div>
</div>

const DIM_MAP = ["work_attitude","stress_response","office_social","deadline_response","ambition_flat"];

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
}

function startQuiz() {
  Q=0; ANSWERS.length=0;
  DIM_MAP.forEach(d=>SCORES[d]=0);
  showScreen('question');
  renderQ();
}

function renderQ() {
  const pct = (Q/25)*100;
  document.getElementById('progress-fill').style.width=pct+'%';
  document.getElementById('q-num').textContent=Q+1;
  document.getElementById('q-text').textContent=Q_TEXTS[Q];
  const container=document.getElementById('options');
  container.innerHTML='';
  OPT_TEXTS[Q].forEach((text,i)=>{
    const btn=document.createElement('button');
    btn.className='option-btn';
    btn.textContent=['A','B','C','D'][i]+'. '+text;
    btn.onclick=()=>selectOpt(i);
    container.appendChild(btn);
  });
}

function selectOpt(idx) {
  const dim=DIM_MAP[Math.floor(Q/5)];
  SCORES[dim]+=Q_DATA[Q].opts[idx].s;
  ANSWERS.push(idx);
  Q++;
  if(Q<25) {
    renderQ();
  } else {
    showScreen('processing');
    setTimeout(showResult,1600);
  }
}

function getResult() {
  let maxScore=0,topDim='';
  DIM_MAP.forEach(d=>{ if(SCORES[d]>maxScore){maxScore=SCORES[d];topDim=d;} });
  const map={work_attitude:0,stress_response:1,office_social:2,deadline_response:3,ambition_flat:4};
  return RESULTS[map[topDim]];
}

function showResult() {
  const r=getResult();
  document.getElementById('r-emoji').textContent=r.emoji;
  document.getElementById('r-name').textContent=r.name;
  document.getElementById('r-desc').textContent=r.desc;
  const tagsEl=document.getElementById('r-tags');
  tagsEl.innerHTML='';
  r.tags.forEach(t=>{ const span=document.createElement('span'); span.className='tag'; span.textContent=t; tagsEl.appendChild(span); });
  showScreen('result');
}

function shareResult() {
  const r=getResult();
  const text=`我在职场竟然是「${r.name}」${r.emoji}！${r.desc} 测一测你是哪种？🐾 #我是哪种职场濒危生物 #职场测试 #打工人`;
  if(navigator.share){ navigator.share({title:document.title,text}); }
  else { copyResult(); }
}

function copyResult() {
  const r=getResult();
  const text=`我在职场竟然是「${r.name}」${r.emoji}！${r.desc} 测一测你是哪种？🐾 #我是哪种职场濒危生物 #职场测试 #打工人`;
  navigator.clipboard.writeText(text).then(()=>alert('已复制到剪贴板！')).catch(()=>alert('复制失败'));
}

function retake() { startQuiz(); }
</script>
